<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>성경 지명 & 지도 뷰어 (Bible Map Viewer)</title>
  <!-- Leaflet CSS (Local with CDN fallback) -->
  <link rel="stylesheet" href="assets/leaflet/leaflet.css" onerror="this.onerror=null;this.href='https://unpkg.com/leaflet@1.9.4/dist/leaflet.css';" />
  <!-- Pretendard Font -->
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <style>
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
      background: transparent !important;
    }
    #map {
      width: 100%;
      height: 100%;
      background: rgba(15, 23, 42, 0.65) !important;
    }
    .leaflet-tile-pane {
      opacity: 0.70 !important; /* 30% 투명도 (지도가 30% 투명하게 보여 족보와 자연스럽게 어우러짐) */
    }
    .custom-pin.selected-pin {
      transform: scale(1.32) !important;
      border: 3px solid #f59e0b !important;
      box-shadow: 0 0 16px rgba(245, 158, 11, 0.9) !important;
      z-index: 9999 !important;
    }
    .marker-label.selected-label {
      background: #f59e0b !important;
      color: #0f172a !important;
      font-weight: 800 !important;
      font-size: 12px !important;
      box-shadow: 0 4px 12px rgba(245, 158, 11, 0.5) !important;
      border: 1.5px solid #ffffff !important;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }
    
    

    /* 상단 슬림 검색창 */
    .search-container {
      position: absolute;
      top: 14px;
      left: 14px;
      z-index: 1500;
      width: 320px;
      max-width: calc(100vw - 140px);
    }
    .search-box {
      width: 100%;
      height: 34px;
      padding: 6px 32px 6px 14px;
      font-size: 13.5px;
      font-weight: 500;
      border: 1px solid rgba(255, 255, 255, 0.4);
      border-radius: 10px;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.28);
      outline: none;
      background: rgba(255, 255, 255, 0.96);
      backdrop-filter: blur(12px);
      transition: all 0.2s ease;
      color: #0f172a;
    }
    .search-box:focus {
      border-color: #2563eb;
      background: #ffffff;
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.25), 0 6px 18px rgba(0, 0, 0, 0.32);
    }
    .search-clear-btn {
      position: absolute;
      right: 8px;
      top: 50%;
      transform: translateY(-50%);
      background: #e2e8f0;
      border: none;
      border-radius: 50%;
      width: 18px;
      height: 18px;
      font-size: 11px;
      font-weight: 700;
      color: #64748b;
      cursor: pointer;
      display: none;
      align-items: center;
      justify-content: center;
      line-height: 1;
    }
    .search-clear-btn:hover {
      background: #cbd5e1;
      color: #0f172a;
    }
    .search-results {
      position: absolute;
      top: 40px;
      left: 0;
      right: 0;
      background: rgba(255, 255, 255, 0.98);
      backdrop-filter: blur(14px);
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
      max-height: 320px;
      overflow-y: auto;
      display: none;
      z-index: 2000;
      border: 1px solid rgba(0, 0, 0, 0.08);
    }
    .search-count-header {
      padding: 7px 12px;
      font-size: 11px;
      font-weight: 700;
      color: #64748b;
      background: #f8fafc;
      border-bottom: 1px solid #e2e8f0;
      display: flex;
      justify-content: space-between;
    }
    .search-item {
      padding: 9px 12px;
      cursor: pointer;
      border-bottom: 1px solid #f1f5f9;
      font-size: 13px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: background 0.15s;
    }
    .search-item:hover, .search-item.active {
      background: #eff6ff;
    }
    .highlight-match {
      color: #2563eb;
      font-weight: 800;
      text-decoration: underline;
    }

    /* 우측 상단 툴바 */
    .top-toolbar {
      position: absolute;
      top: 14px;
      right: 14px;
      z-index: 1500;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .tool-btn {
      height: 34px;
      padding: 0 12px;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      border: 1px solid rgba(0, 0, 0, 0.1);
      border-radius: 18px;
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(12px);
      color: #1e293b;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 3px 12px rgba(0, 0, 0, 0.2);
      transition: all 0.15s ease;
      white-space: nowrap;
    }
    .tool-btn:hover {
      background: #f8fafc;
      transform: translateY(-1px);
      box-shadow: 0 5px 16px rgba(0, 0, 0, 0.25);
    }
    .tool-btn:active {
      transform: translateY(0);
    }

    /* 지도 마커 및 라벨 스타일 */
    .custom-pin {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: white;
      border: 2px solid #2563eb;
      box-shadow: 0 2px 8px rgba(0,0,0,0.35);
      font-size: 13px;
      cursor: pointer;
      transition: transform 0.15s ease;
    }
    .custom-pin:hover {
      transform: scale(1.22);
      z-index: 9999 !important;
    }
    .pin-city { border-color: #2563eb; color: #1e40af; }
    .pin-mountain { border-color: #059669; color: #065f46; }
    .pin-river { border-color: #0284c7; color: #075985; }
    .pin-sea { border-color: #0369a1; color: #0c4a6e; }
    .pin-desert { border-color: #d97706; color: #92400e; }
    .pin-region { border-color: #7c3aed; color: #5b21b6; }

    .marker-label {
      background: rgba(15, 23, 42, 0.88);
      backdrop-filter: blur(6px);
      border: 1px solid rgba(255, 255, 255, 0.25);
      border-radius: 5px;
      color: #ffffff;
      font-size: 11px;
      font-weight: 700;
      padding: 2px 6px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.4);
      white-space: nowrap;
      pointer-events: none;
    }

    
    
    .leaflet-control-attribution {
      display: none !important;
    }


    .leaflet-control-attribution a {
      color: #93c5fd !important;
      text-decoration: underline !important;
    }

    /* 선택 마커 펄스 애니메이션 */
    .pulse-ring {
      position: absolute;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: 3px solid #f59e0b;
      box-shadow: 0 0 15px #f59e0b;
      animation: pulseAnim 1.6s infinite ease-out;
      pointer-events: none;
      top: -8px;
      left: -8px;
    }
    @keyframes pulseAnim {
      0% { transform: scale(0.6); opacity: 1; }
      100% { transform: scale(1.6); opacity: 0; }
    }

    /* 하단/우측 상세 정보 카드 */
    .detail-card {
      position: absolute;
      bottom: 20px;
      right: 20px;
      width: 360px;
      max-width: calc(100vw - 32px);
      max-height: min(480px, calc(100vh - 100px));
      background: rgba(255, 255, 255, 0.98);
      backdrop-filter: blur(16px);
      border-radius: 18px;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.35);
      border: 1px solid rgba(0, 0, 0, 0.1);
      padding: 18px 20px;
      display: none;
      flex-direction: column;
      z-index: 1600;
      animation: slideUp 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }
    @keyframes slideUp {
      from { transform: translateY(24px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }
    .detail-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 12px;
      padding-bottom: 10px;
      border-bottom: 1px solid #e2e8f0;
    }
    .detail-title-wrap {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .detail-title {
      font-size: 19px;
      font-weight: 800;
      color: #0f172a;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .detail-subtitle {
      font-size: 12px;
      color: #64748b;
      font-weight: 500;
    }
    .detail-badge {
      display: inline-block;
      font-size: 11px;
      font-weight: 700;
      padding: 2px 7px;
      border-radius: 6px;
      background: #eff6ff;
      color: #1d4ed8;
      width: fit-content;
    }
    .detail-close-btn {
      background: none;
      border: none;
      font-size: 22px;
      color: #94a3b8;
      cursor: pointer;
      line-height: 1;
      padding: 0 4px;
    }
    .detail-close-btn:hover {
      color: #0f172a;
    }
    .detail-body {
      overflow-y: auto;
      flex: 1;
      font-size: 13px;
      line-height: 1.65;
      color: #334155;
      padding-right: 4px;
    }
    .detail-body::-webkit-scrollbar {
      width: 4px;
    }
    .detail-body::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 4px;
    }
    .detail-desc {
      white-space: pre-wrap;
      word-break: break-word;
      margin-bottom: 14px;
    }
    .detail-actions {
      display: flex;
      gap: 8px;
      margin-top: 12px;
      padding-top: 10px;
      border-top: 1px solid #f1f5f9;
    }
    .btn-action {
      flex: 1;
      padding: 8px 10px;
      font-size: 12px;
      font-weight: 700;
      border-radius: 8px;
      border: 1px solid #e2e8f0;
      background: #f8fafc;
      color: #334155;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      transition: all 0.15s;
    }
    .btn-action:hover {
      background: #f1f5f9;
      color: #0f172a;
    }

    /* 알림 토스트 */
    .toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(15, 23, 42, 0.92);
      backdrop-filter: blur(10px);
      color: white;
      padding: 9px 18px;
      border-radius: 20px;
      font-size: 12.5px;
      font-weight: 600;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.35);
      z-index: 9999;
      display: none;
      animation: fadeIn 0.2s ease;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translate(-50%, 8px); }
      to { opacity: 1; transform: translate(-50%, 0); }
    }

    /* 모바일 반응형 */
    @media (max-width: 640px) {
      .search-container {
        top: 10px;
        left: 10px;
        width: calc(100vw - 120px);
      }
      .top-toolbar {
        top: 10px;
        right: 10px;
      }
      .tool-btn-text {
        display: none;
      }
      .tool-btn {
        padding: 0 9px;
      }
      .detail-card {
        left: 10px;
        right: 10px;
        bottom: 12px;
        max-width: none;
        max-height: 50vh;
      }
    }
  </style>
</head>
<body>

  <!-- 지도 컨테이너 -->
  <div id="map"></div>

  <!-- 슬림 검색창 -->
  <div class="search-container">
    <div style="position: relative;">
      <input type="text" id="searchInput" class="search-box" placeholder="성경 지명 검색 (예: 예루살렘, 갈릴리)" autocomplete="off" />
      <button class="search-clear-btn" id="searchClearBtn" onclick="clearSearch()" title="검색어 지우기">&times;</button>
    </div>
    <div class="search-results" id="searchResults"></div>
  </div>

  <!-- 우측 상단 툴바 -->
  <div class="top-toolbar">
    <button class="tool-btn" id="btnToggleMap" onclick="toggleMapTile()" title="위성 지도 / 지형 지도 전환">
      <span>🗺️</span>
      <span class="tool-btn-text" id="mapToggleTitle">지형 지도</span>
    </button>
  </div>

  <!-- 지명 상세 정보 카드 -->
  <div class="detail-card" id="detailCard">
    <div class="detail-header">
      <div class="detail-title-wrap">
        <div class="detail-title">
          <span id="detailIcon">📍</span>
          <span id="detailName">예루살렘</span>
        </div>
        <div style="display:flex; align-items:center; gap:8px;">
          <span class="detail-badge" id="detailBadge">성읍/도시</span>
          <span class="detail-subtitle" id="detailCoords">31.78°, 35.23°</span>
        </div>
      </div>
      <button class="detail-close-btn" onclick="closeDetailCard()">&times;</button>
    </div>
    <div class="detail-body">
      <div class="detail-desc" id="detailDesc"></div>
    </div>
    <div class="detail-actions">
      <button class="btn-action" onclick="copyPlaceInfo()">
        <span>📋</span> 정보 복사
      </button>
      <button class="btn-action" onclick="zoomToCurrentPlace()">
        <span>🔍</span> 확대 보기
      </button>
    </div>
  </div>

  <!-- 토스트 알림 -->
  <div class="toast" id="toast"></div>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <!-- 뷰어 스크립트 -->
  <script>
    // 1. 성경 지명 원본 데이터 (1,600+ 지명)
    const placesData = [{"id": "loc_1", "name": "예루살렘", "lat": 31.77744, "lng": 35.23494, "desc": "사무엘상 17:54사울에게서 도망가는 다윗\n뜻: 평화의 터전\n유대와 베냐민 두지파의 경계선상에 있으며 지중해 헤브론 요단강 사마리아로접경을 삼고 있다.\n이 명칭은 수10:1에 처음 기재되었으나 오래전부터 있어 옛 이름이 살렘 우루살렘이라라 하나 확증이 없고 확실한 것은 여부스이며 (삿19:10-11)별명으로 오홀리바라 하고(겔23:4) 시온산의 이름을 따라 시온성 다윗왕의 도성인고로 다윗성,고라의 자손은 하나님의 성리라 하고 하나님 의 성전이 있는고로 거룩한 성이다라 하였다(삼하5:7,5:9,눅2:11,시46:4, 느11:1,마4:5). 이로부터 유대인들은 이 예루살렘을 극히 존중히 여기고 경모 하였다(시122:6,137:5-6,왕상8:38, 사62:1, 7, 단6:10,마5:35).\n스가랴선지는 많은 백성과 강대한 나라들이 예루살렘으로 와서 만군의 여호와를 찾고 여호와를 구하라고 예언하였고(슥8:22-23).사도들은 한층 더 고상히게 위에 있는 예루살렘은 자유성이라 하였다(갈4:26).너희가 이를곳은 시온산과 하나 님의 도성인 하늘의 예루살렘이라 하였고(히12:22)내 하나님으로부터 내려오는 새 예루살렘의 이름과 나의 새 이름이 그의 위에 기록하리라 하고(계3: 12) 또 내가 보매 거룩한 성 새 예루살렘이 하나님으로부터 내려오니 그 예 비한 것이 신부가 신랑을 위하여 단장한 것 같다고 하였다(계21:2).\n\n(1) 역사적 종교적 중요성.\n예루살렘은 고대 가나안 사람의 수도였으나 B.C 1,000년경 다윗왕이 점령 령하였다.\n아모스와 호세아를 제외한 모든 선지자들의 활동무대였으며 구약 성경 대부분이 여기서 기록되었다.\nB.C.586년 느부갓네살이 점령하였고 포로 에서 돌라온 후 다시 재건하였으며 파사 희랍 로마시대를 통하여 그의 신성을을 점점 더하였다.\n예수의 사역,죽음,부활,승천의 무대였다.\n\nA.D.70년 타이러스가 예루살렘을 함락시켰고 136년 하도리안 황제때 재건되었었다가 637년 칼리프 오말에게 점령되었고 회회교의 중심지가 되었다. 1099년 십자군이 점령하였고 1517년 알렌비장군의 연합군이 점령하기까지 터키 사람 의 수중에 있었다. 1920년 국제 연맹의 결의로써 영국의 위임통치로 되었다가 제 2차 대전 이후에 독립하였다.\n\n(2) 위치와 기후\n고대 문헌을 참고해 볼 때 현재의 예루살렘은 고대 예루살렘의 터위에 건설된 것이 확실하다. 기후는 이탈리아의 북부와 비슷하며 겨울에는 영하2도쯤되며 눈도 내리지만 오래 쌓여있지 않는다. 여름철에는 평균 최고 30도 를 넘지 않는다.\n\n(3) 성전의 위치.\n솔로몬의 성전은 B.C.586년 느부갓네살의 손에 부서지기까지 존속하였고 포로 기간 중에도 그 위 치를 잊어버리지 않았다(렘41:5,학2:3,스3:12).\nB.C.516년 스룹바벨이 그 자리에서 다시 지었다(스6:15).\n요세퍼스에 의하면 헤롯의 성전은 그런 것을 확장 미화한 데 불과하다고 한다.\n\n(4) 지세.\n가) 기드론 골짜기:이 골짜기는 예루살렘 동쪽 와디 싯티 마리암일 것이다.\n요18:1과 막14:26 을 보면 예수가 감람산에 가실 때 이 골짜기를 건느셨다\n\n나) 힌놈 골짜기: 이 골짜기는 예루살렘 서남쪽을 에워싼 넓은 골짜기 로서 와디엘 라바비일 것이다.\n\n다) 혈 로겔: 골짜기와 깊은 관계가 있는 것은 샘과 못이다.\n왕상1:을 보면 아도니아는 엘로겔에서 대관식을 거행 하였으며 솔로몬은 기혼에서 행하였다.\n\n라) 베데스다:38년된 병자가 일어난 곳이다(요5:) 예루살렘 부근에는기혼(처녀의 샘)이 유일한 간혈천이다.\n아마 이것이 베데스다 못의 유적일 것이다.\n\n마) 실로암 지금은 아인이라고 부르는데 실상은 샘이 아니라 처녀의 샘 이 아니라 처녀의 샘의 물을 바위를 뚫어서 급수한 것이었다고 한다.\n\n(5) 시대적 증거\n가) 솔로몬 시대에는 예루살렘 성전,왕궁,바로의 딸의 집이 계속해있으며 주위는 성벽을 쌓았다.\n왕궁은 남쪽에 있었으리라 본다.\n왜냐하면 다윗궁 보 다는 높고 경전보다는 낮다고 하였다 (왕상6:36,7:8,12<사1:26,왕상8:1,9:24,10:5,왕하11:19,렘22:1,26:10,왕상7:8,9:24,3:1,9:15).\n\n나) 히스기야 시대의 예루살렘 히스기야왕은 산헤립의 침입을 예상하여 기혼의 물을 다윗성 서쪽에 끌어들이는 수로의 기록이 있다.\n(왕하20:20,대하32:4,30,7:3,사22:9-11).이것은 바위를 뚫은 굴인데 이 굴 의 안벽에는 옛날 히브 리어의 비문이 조각되어 있다.\n이것이 실로암 비문이다 다.\n\n다) 신약시대의 예루살렘. 신약시대에 있어서는 예수의 예루살렘 방문이 가장 큰 사건이다 예수님이 처음 세번 예루살렘을 방문하신 것은 성전과 관계가 있었다 (눅2:22-39,41-50, 요2:13-22).네번째는 베데스다 못(요 9: \n다섯번째는 성전(요7:) 여섯번째는 실로암못과 관계가 있었다(요9:) 일곱번째는 예루살렘에 올라가소 수난주일 동안 일,월,화요일에 성전에서 가르치셨다 (막11:-16:) 목요일에는 다락방에서 만찬을 잡수셨다(막14:15) 이 다락방은 마가의 어머니 마리아의 집이었을 것이다.\n이곳은 예수님이 승천하신 후에 초대교회의 집회 장소가 되었다.\n전설에 의하면 욥바의 문곁 에 빌라도의 집이 있었다고 하며 헤롯 궁전과 같이 있었을 것이라 한다.\n\n십자가와 무던의 장소인 골고다에는 현재의 성묘교회가 서 있다고 한다 옹기쟁이의 밭 \"아겔다마\"는 나그네의 매장지였다(행1:18).\n\n예레미야 1:3, 예레미야 1:15, 예레미야 2:2, 예레미야 3:17, 예레미야 4:3, 예레미야 4:4, 예레미야 4:5, 예레미야 4:10, 예레미야 4:11, 예레미야 4:14, 예레미야 4:16, 예레미야 5:1, 예레미야 6:1, 예레미야 6:6, 예레미야 6:8, 예레미야 7:17, 예레미야 7:34, 예레미야 8:1, 예레미야 9:11, 예레미야 11:2, 예레미야 11:6, 예레미야 11:9, 예레미야 11:12, 예레미야 11:13, 예레미야 13:9, 예레미야 13:13, 예레미야 13:27, 예레미야 14:2, 예레미야 14:16, 예레미야 15:4, 예레미야 15:5, 예레미야 17:19, 예레미야 17:20, 예레미야 17:21, 예레미야 17:25, 예레미야 17:26, 예레미야 17:27, 예레미야 18:11, 예레미야 19:3, 예레미야 19:7, 예레미야 19:13, 예레미야 22:19, 예레미야 23:14, 예레미야 23:15, 예레미야 24:1, 예레미야 24:8, 예레미야 25:2, 예레미야 25:18, 예레미야 26:18, 예레미야 27:3, 예레미야 27:18, 예레미야 27:20, 예레미야 27:21, 예레미야 29:1, 예레미야 29:2, 예레미야 29:4, 예레미야 29:20, 예레미야 29:25, 예레미야 32:2, 예레미야 32:32, 예레미야 32:44, 예레미야 33:10, 예레미야 33:13, 예레미야 33:16, 예레미야 34:1, 예레미야 34:6, 예레미야 34:7, 예레미야 34:8, 예레미야 34:19, 예레미야 35:11, 예레미야 35:13, 예레미야 35:17, 예레미야 36:9, 예레미야 36:31, 예레미야 37:5, 예레미야 37:11, 예레미야 37:12, 예레미야 38:28, 예레미야 39:1, 예레미야 39:8, 예레미야 40:1, 예레미야 42:18, 예레미야 44:2, 예레미야 44:6, 예레미야 44:9, 예레미야 44:13, 예레미야 44:17, 예레미야 44:21, 예레미야 51:35, 예레미야 51:50, 예레미야 52:1, 예레미야 52:3, 예레미야 52:4, 예레미야 52:12, 예레미야 52:13, 예레미야 52:14, 예레미야 52:29\n\n역대하 1:4, 역대하 1:13, 역대하 1:14, 역대하 1:15, 역대하 2:7, 역대하 2:16, 역대하 3:1, 역대하 5:2, 역대하 6:6, 역대하 8:6, 역대하 9:1 ock;vertical-align:top;position:relative}._IGc{font-size:10px;font-style:italic}._EVi{font-weight:600}            Tanis      San Al Hagar Al Qebleyah  Markaz El-Hosayneya  앗 샤르키야  이집트     타니스는 고대 이집트의 도시로, 이집트어로는 자네트라고 불렸다. 나일 삼각주의 북동부에 위치한다.\n타니스는 이집트 제20왕조 말기에 건설되었으며, 제21왕조의 스멘데스 1세의 고향이자, 제21왕조의 수도이기도 했다. 이집트 제3중간기의 혼란기 동안, 타니스는 하이집트 지방의 중심지로 자리매김 하였다.\n이후 이집트의 수도는 사이스, 알렉산드리아로 옮겨졌지만, 타니스는 계속해서 이 지역의 중심지로 남아 있었다.      위키백과                         \n\n뜻: 람세스 왕의 재산 \n바로 람세스 2세상 : 이집트 제 19왕조의 압제자 람세스 2세(BC 1290-1224)는 이스라엘 민족을 혹사시켜 국고성 비돔과 라암셋을 건설하였다. \n회색화 강암 높이 77cm 타니스 출토.\n나일강 어귀 삼각주에 있으며 마이에타(Damietta) 남동쪽 약 29km 지점. 타니스(소안)과 동일시 보기도 한다.\n\n(1) 애굽의 동북부 제 20주 곧 고센 지뱝의 한 성읍인데 이스라엘 백성이 건 설한 애굽의 국고성이다(출1:11).\n\n(2) 이스라엘 백성의 중심지로 출애굽시에 이곳에서 출발하였다(출12:37).\n\n(3) 야곱이 애굽에 갔을때 바로가 특별히 이스라엘에게 준 땅(창47:11).\n라암셋-흙짚벽돌의 흔적/이스라엘 강제노역의 본거지 출애굽기 1장의 기록을 보면, 야곱의 후손은 이집트에 정착해서 그 수가 크게 늘어나게 되었으며, 12 아들의 후손, 곧 이스라엘 사람들은 다른 `아피루'들과 함께 비돔과 라암셋 도시를 건축하는데 강제 노동자로 동원되었다.\n\n이때가 바로 세티 1세 시대로 보는데, 이에 이의를 제기하는 학자는 거의 없다. 강대한 이집트 제국의 `노예'로 전락하게 된 이스라엘 사람들은 혹독하고 절망적인 강제 노동의 상황에서 그들의 여호와 하나님께 구원을 간구하였다.\n\n궁터의 흔적 마침내 여호와 하나님으로부터 출애굽의 지도자로서 사명을 받았다고 확신한 모세가 출현하였고, 모세의 영도 밑에서 이스라엘 사람들은 노예의 땅, 이집트에서 벗어나 해방되는 출애굽을 경험하였다.\n\n출애굽의 연대는 일반적으로 주전 13세기 초, 즉 1290년경으로 생각하고 있으며, 출애굽 때 이집트의 바로(고대 이집트 왕을 지칭하는 명칭)는 세티 1세의 뒤를 이은 라암셋 2세(주전 1290-1224년)였다.\n\n(한국컴퓨터선교회제공 / Copyrightⓒ 1999-2001 K.C.M All webmaster@kcm.co.kr)\n\n민수기 33:3, 민수기 33:5\n\n출애굽기 12:37\n\n창세기 47:11\n\n출애굽기 1:11", "isMajor": true, "count": 12, "type": "city"}, {"id": "loc_106", "name": "게데스", "lat": 33.11298, "lng": 35.53361, "desc": "여호수아 12:22, 여호수아 19:37, 여호수아 20:7, 여호수아 21:32\n\n사사기 4:9, 사사기 4:10, 사사기 4:11\n\n여호수아 15:23\n\n열왕기하 15:29\n\n역대상 6:76\n\n역대상 6:72", "isMajor": true, "count": 12, "type": "city"}, {"id": "loc_107", "name": "믹마스", "lat": 31.87018, "lng": 35.27923, "desc": "사무엘상 13:2, 사무엘상 13:5, 사무엘상 13:11, 사무엘상 13:16, 사무엘상 13:23, 사무엘상 14:5, 사무엘상 14:31\n\n느헤미야 11:31\n\n느헤미야 7:31\n\n이사야 10:28\n\n에스라 2:27", "isMajor": true, "coun :30", "isMajor": true, "count": 6, "type": "city"}, {"id": "loc_281", "name": "데만", "lat": 30.3285, "lng": 35.7275, "desc": "에돔 북동쪽 지역. 욥의 거주지와 가장 가까운 곳 중 하나.\n\n예레미야 49:7, 예레미야 49:20\n\n에스겔 25:13\n\n아모스 1:12\n\n오바댜 1:9\n\n하박국 3:3", "isMajor": true, "count": 6, "type": "region"}, {"id": "loc_282", "name": "제", "lat": 19.50974, "lng": 30.40286, "desc": "", "isMajor": true, "count": 6, "type": "city"}, {"id": "loc_283", "name": "도피성", "lat": 32.22211, "lng": 35.25856, "desc": "지명의 뜻은 ‘일부분’이란 뜻이요, 팔레스틴의 중요산맥인 에발산과 그리심산 사이에 있는 한 성읍이니 예루살렘에서 북으로 36마일이다. 옛적에 아브라함이 단을 쌓았고 축복을 받았던 곳이며(창12:1-7), 야곱이 처가에서 돌아오다가 하몰에게서 밭을 사서 장막을 치고 단을 쌓고(창33:18-20) 야곱의 딸 디나가 하몰의 아들 세겜에게 욕을 당하므로 야곱의 아들들이 성의 모든 남자를 죽이고 재산을 약탈하였으며(창34:25-29), 요셉의 형들이 양을 치던 곳이요, 요셉이 찾아가서 변을 당한 곳이며(창37:12- ), 그후 요셉의 해골을 애굽에서 가지고 와서 장사하였으며(수24:32), 에브라임 지파에게 분배되고 도피성이 되었으며(수17:7-9, 20:7) 또한 이스라엘 민족의 집회장이 되었다. 여호수아가 에발산에 제단을 쌓은 후 율법을 낭독한 곳이며(수8:30-35, 24:1, 25), 그 후 세겜과 밀로인들이 모여 아비멜렉으로 왕을 삼았고(삿9:6) 또한 르호보암으로 왕을 삼으려다가 10지파가 배척하고 여로보암을 청해서 왕을 삼았고(왕상12:1, 16, 20) 여로보암이 성을 쌓고 수도로 삼았던 곳이다(왕상12:25).\n\n지명의 뜻은 ‘연합’이며 고고학자들은 세계에서 최초로 성을 세운 곳이라고도 한다. 아낙자손들이 살던 곳으로써 옛 이름은 기럇아르바요(수15:13, 삿1:10), 현재의 이름은 엘칼릴이라고도 한다. 이 성에는 막벨라 굴이 있고 그곳에는 아브라함, 사라, 이삭, 리브가, 레아, 야곱 등을 장사하였다. 그 후 유다지파가 분배 받아서 갈렙이 주관하면서 이곳에 도피성을 세웠다(수10:36, 15:54, 21:10-12). 또한 다윗왕이 첫 번 수도로 삼고 7년간 치리를 하였으며(삼하2:11), 압살롬은 이 성에서 반역의 봉화를 들었고(삼하15:7), 르호보암 왕은 15요새 중의 하나를 여기에 건축하였고(대하11:10), 옛적 정탐꾼들이 포도를 따 가지고 온 곳이요(민13:23), 지금도 포도로 이름난 곳이다.\n\n지명의 뜻은 ‘거룩하다’는 의미가 있는 곳으로써 납달리의 산지 갈릴리 게데스라(수20:7, 21:32, 삿4:6). 또는 간단히 게데스라 부른다(수12:22, 19:37). 옛적에는 가나안의 성소이었고, 이스라엘이 점령한 후는 납달리의 한 성읍이 되고, 이스라엘 백성 중 그릇 살인한 자의 도피성 중의 하나가 되었고(수20:7), 사사 바락의 출생지요, 그의 군대의 집합장소가 되었다(삿4:6-10). 이 지역은 후레호(湖)의 서북 7㎞지점이 되며 로마시대에는 태양신을 섬기는 신당이 있는 곳으로 항상 중요 도시이었다\n\n요단강 동쪽에 있는 성읍으로써 갓 지파의 분깃의 땅이며, 가장 중요한 도시였으며, 갓 지파를 위해서 모세가 도피성을 세워 오살한 자들이 도망하여 살게 한 곳이고(신4:43), 솔로몬 왕 때에는 12관장 중 한 사람이 치리하던 곳이고(왕상4:7-13), 이스라엘과 수리아의 싸움은 이 도시를 차지하기 위해서했었다(왕상22:3, 왕하8:28, 9:1). 교통이 좋은 중앙지인 곳이다.\n\n지명의 뜻은 ‘성체’라 하며 르우벤 지파가 분깃으로 받은 땅으로써 요단강 동편에 있으며 또 레위 자손에게 주어 도피성으로 삼았다(신4:43, 수20:8, 21:36, 대상6:28). 이곳은 모압 고지 동편에 있었다고 하나 현재 그 소재지를 알 수 없으며 성경 상에 아무런 역사적인 것이 없다.\n\n갈릴리 바다 동북에 있는 도시로써 므낫세 지파가 분깃으로 받았으며 바산에 있는 므낫세의 성읍으로써 요단강 동편의 세 도피성의 하나이며(신4:43, 수20:8), 레위 지파 중 게르손 자손에게 주어서 다스렸던 곳이다(수21:27, 대상6:71).", "isMajor": true, "count": 6, "type": "city"}, {"id": "loc_284", "name": "므낫세", "lat": 32.87958, "lng": 35.85904, "desc": "", "isMajor": true, "count": 6, "type": "city"}, {"id": "loc_285", "name": "갈릴리산지", "lat": 32.85265, "lng": 35.39862, "desc": "", "isMajor": true, "count": 5, "type": "city"}, {"id": "loc_286", "name": "악고평야", "lat": 32.86005, "lng": 35.11024, "desc": "", "isMajor": true, "count": 5, "type": "region"}, {"id": "loc_287", "name": "고센땅", "lat": 30.85956, "lng": 32.01502, "desc": "", "isMajor": true, "count": 5, "type": "city"}, {"id": "loc_288", "name": "비블로스", "lat": 34.1194, "lng": 35.64507, "desc": "", "isMajor": true, "count": 5, "type": "city"}, {"id": "loc_289", "name": "데마", "lat": 27.63317, "lng": 38.55412, "desc": "예레미야 25:23\n\n이사야 21:14\n\n욥기 6:19", "isMajor": true, "count": 5, "type": "city"}, {"id": "loc_290", "name": "에블라", "lat": 36.21845, "lng": 37.15035, "desc": "", "isMajor": true, "count": 5, "type": "city"}, {"id": "loc_291", "name": "호르산", "lat": 30.3174, "lng": 35.40715, "desc": "민수기 20:22, 민수기 20:23, 민수기 20:25, 민수기 20:27, 민수기 21:4, 민수기 33:37, 민수기 33:38, 민수기 33:39, 민수기 33:41\n\n민수기 34:7, 민수기 34:8\n\n신명기 32:50", "isMajor": true, "count": 5, "type": "mountain"}, {"id": "loc_292", "name": "다말", "lat": 31.02492, "lng": 35.06415, "desc": "에스겔 47:18, 에스겔 47:19, 에스겔 48:28", "isMajor": true, "count": 5, "type": "city"}, {"id": "loc_293", "name": "거라사", "lat": 32.27465, "lng": 35.89608, "desc": "body{font-family:Roboto,Arial,sans-serif}._qNc{background-color:#fafafa;border-radius:2px;bottom:2px;left:2px;position:absolute;right:2px;top:2px}._yNc{font-size:18px;font-weight:bold;line-height:25px;margin-bottom:5px}._pNc{font-size:14px;font-weight:300;line-height:18px;ma             // 5. 고르게 분포되는 동적 마커 렌더링 시스템 (화면 크기 반응형 & 픽셀 기반 겹침 방지)
    const markersLayer = L.layerGroup().addTo(map);
    let selectedHighlightMarker = null;
    let currentSelectedPlace = null;

    function updateMarkers() {
      markersLayer.clearLayers();
      if (!map) return;

      const size = map.getSize();
      const width = size.x || window.innerWidth;
      const height = size.y || window.innerHeight;
      const isMobile = width <= 768;

      // 화면 면적 및 기기에 따른 최적 마커 수 계산 (모바일 10개 전후, 대화면 30~40개)
      const area = width * height;
      const targetCount = isMobile 
        ? Math.max(8, Math.min(14, Math.round(area / 28000))) 
        : Math.max(20, Math.min(42, Math.round(area / 22000)));

      // 최소 픽셀 간격 설정 (가로 라벨 길이 고려하여 가로 60px, 세로 38px, 반경 50px)
      const minSpacingX = isMobile ? 65 : 55;
      const minSpacingY = isMobile ? 42 : 36;
      const minRadius = isMobile ? 52 : 44;

      const placedList = [];
      const placedScreenPts = [];

      // 1. 현재 선택된 중심 지명이 있다면 1순위로 확정 배치
      if (currentSelectedPlace && typeof currentSelectedPlace.lat === 'number' && typeof currentSelectedPlace.lng === 'number') {
        const pt = map.latLngToContainerPoint([currentSelectedPlace.lat, currentSelectedPlace.lng]);
        placedList.push(currentSelectedPlace);
        placedScreenPts.push({ x: pt.x, y: pt.y });
      }

      // 2. 현재 지도 뷰포트 내(혹은 인근) 후보 지명 수집 및 점수화
      const bounds = map.getBounds().pad(0.05); // 약간의 패딩 포함
      const center = currentSelectedPlace 
        ? L.latLng(currentSelectedPlace.lat, currentSelectedPlace.lng) 
        : map.getCenter();

      const candidates = placesData.filter(p => {
        if (currentSelectedPlace && p.id === currentSelectedPlace.id) return false;
        return bounds.contains([p.lat, p.lng]);
      });

      // 후보 지명 점수 매기기 (중요 거점 가중치 + 등장 빈도 + 중심 지점과의 적정 분산도)
      candidates.forEach(p => {
        const distToCenter = center.distanceTo(L.latLng(p.lat, p.lng)); // 미터 단위 거리
        const distKm = distToCenter / 1000;
        
        let score = (p.isMajor ? 120 : 0) + Math.min(60, (p.count || 1) * 3);
        // 중심 근처와 외곽이 고르게 나오도록 거리 패널티 완화
        score -= Math.log10(distKm + 1) * 15;
        p._renderScore = score;
      });

      // 점수순 정렬
      candidates.sort((a, b) => b._renderScore - a._renderScore);

      // 3. 픽셀 충돌 검사(Spatial Collision Check)로 화면 전체에 고르게 분산 배치
      for (const p of candidates) {
        if (placedList.length >= targetCount) break;

        const pt = map.latLngToContainerPoint([p.lat, p.lng]);

        // 화면 밖 여백(마진 20px) 벗어나면 제외
        if (pt.x < 20 || pt.x > width - 20 || pt.y < 20 || pt.y > height - 20) {
          continue;
        }

        // 이미 배치된 마커들과의 픽셀 간격 검사 (타원/박스 충돌 모델)
        let isOverlapping = false;
        for (const placedPt of placedScreenPts) {
          const dx = Math.abs(pt.x - placedPt.x);
          const dy = Math.abs(pt.y - placedPt.y);
          const dist = Math.hypot(dx, dy);

          if (dist < minRadius || (dx < minSpacingX && dy < minSpacingY)) {
            isOverlapping = true;
            break;
          }
        }

        if (!isOverlapping) {
          placedList.push(p);
          placedScreenPts.push({ x: pt.x, y: pt.y });
        }
      }

      // 4. 선별된 지명들을 지도에 렌더링
      placedList.forEach(p => {
        const isSelected = currentSelectedPlace && (currentSelectedPlace.id === p.id || currentSelectedPlace.name === p.name);
        const cfg = typeConfigs[p.type || 'city'] || typeConfigs.city;

          html: iconHtml,
          iconSize: isSelected ? [32, 32] : [26, 26],
          iconAnchor: isSelected ? [16, 16] : [13, 13]
        });

        const marker = L.marker([p.lat, p.lng], {
          icon: icon,
          zIndexOffset: isSelected ? 3000 : (p.isMajor ? 500 : 100)
        });

        marker.bindTooltip(p.name, {
          permanent: true,
          direction: 'bottom',
          offset: [0, isSelected ? 16 : 13],
          className: isSelected ? 'marker-label selected-label' : 'marker-label'
        });

        marker.on('click', (e) => {
          if (e && e.originalEvent) e.originalEvent.stopPropagation();
          showDetail(p);
        });

        markersLayer.addLayer(marker);
      });
    }

    map.on('moveend zoomend resize', updateMarkers);
    window.addEventListener('resize', () => {
      if (map) {
        map.invalidateSize();
        updateMarkers();
      }
    });

    // 6. 지명 상세 정보 카드 표시
    window.showDetail = function(p) {
      currentSelectedPlace = p;
      const cfg = typeConfigs[p.type || 'city'] || typeConfigs.city;

      document.getElementById('detailIcon').innerText = cfg.icon;
      document.getElementById('detailName').innerText = p.name;
      document.getElementById('detailBadge').innerText = cfg.nameKo;
      document.getElementById('detailBadge').style.background = cfg.color + '1a';
      document.getElementById('detailBadge').style.color = cfg.color;
      document.getElementById('detailCoords').innerText = `${p.lat.toFixed(2)}°, ${p.lng.toFixed(2)}°`;

      const descBox = document.getElementById('detailDesc');
      descBox.innerText = p.desc || '성경 속 역사적 지명입니다.';

      const card = document.getElementById('detailCard');
      card.style.display = 'flex';

      // 펄스 하이라이트 마커
      if (selectedHighlightMarker) {
        map.removeLayer(selectedHighlightMarker);
      }
      const pulseHtml = '<div class="pulse-ring"></div>';
      const pulseIcon = L.divIcon({ className: '', html: pulseHtml, iconSize: [44, 44], iconAnchor: [14, 14] });
      selectedHighlightMarker = L.marker([p.lat, p.lng], { icon: pulseIcon, interactive: false, zIndexOffset: 2000 }).addTo(map);

      // 지정된 지명을 중심으로 화면 전체에 펼쳐지도록 부드럽게 이동
      const targetZoom = window.innerWidth <= 768 ? 12 : 13;
      map.flyTo([p.lat, p.lng], targetZoom, { duration: 0.5 });
      
      setTimeout(() => {
        updateMarkers();
      }, 550);

      // 부모 창(족보앱)에 지명 선택 이벤트 통지
      if (window.parent && window.parent !== window) {
        window.parent.postMessage({
          action: 'placeSelected',
          place: p
        }, '*');
      }
    };

    window.closeDetailCard = function() {
      document.getElementById('detailCard').style.display = 'none';
      if (selectedHighlightMarker) {
        map.removeLayer(selectedHighlightMarker);
        selectedHighlightMarker = null;
      }
      currentSelectedPlace = null;
      updateMarkers();
    };

    window.zoomToCurrentPlace = function() {
      if (currentSelectedPlace) {
        map.setView([currentSelectedPlace.lat, currentSelectedPlace.lng], 14);
      }
    };

    window.copyPlaceInfo = function() {
      if (!currentSelectedPlace) return;
      const info = `[성경 지명] ${currentSelectedPlace.name}\n좌표: ${currentSelectedPlace.lat}, ${currentSelectedPlace.lng}\n설명: ${currentSelectedPlace.desc || ''}`;
      navigator.clipboard.writeText(info).then(() => {
        showToast('📋 지명 정보가 클립보드에 복사되었습니다.');
      }).catch(() => {
        showToast('복사에 실패했습니다.');
      });
    };

    // 7. 실시간 검색 엔진
    const searchInput = document.getElementById('searchInput');
    const searchResults = document.getElementById('searchResults');
    const searchClearBtn = document.getElementById('searchClearBtn');
    let currentSearchActiveIndex = -1;
    let currentSearchResultsList = [];

    function executeSearch(query) {
      const q = (query || '').trim();
      if (!q) {
        searchResults.style.display = 'none';
        searchClearBtn.style.display = 'none';
        currentSearchActiveIndex = -1;
        currentSearchResultsList = [];
        return;
      }

      searchClearBtn.style.display = 'flex';
      const qClean = q.toLowerCase().replace(/\s+/g, '');
      const aliasTarget = searchAliases[qClean] || '';

      const scored = [];
      placesData.forEach(p => {
        const nameClean = p.name.toLowerCase().replace(/\s+/g, '');
        let score = 0;
        let matchReason = '';

        if (nameClean === qClean) {
          score = 100;
        } else if (nameClean.startsWith(qClean)) {
          score = 80;
        } else if (nameClean.includes(qClean)) {
          score = 60;
        } else if (aliasTarget && nameClean.includes(aliasTarget)) {
          score = 50;
          matchReason = `[연관: ${aliasTarget}]`;
        } else if (p.desc && p.desc.toLowerCase().includes(qClean)) {
          score = 30;
          matchReason = '[설명/구절 일치]';
        }

        if (score > 0) {
          score += Math.min(10, (p.count || 1));
          if (p.isMajor) score += 5;
          scored.push({ place: p, score: score, matchReason: matchReason });
        }
      });

      scored.sort((a, b) => b.score - a.score);
      const topResults = scored.slice(0, 30).map(s => Object.assign({}, s.place, { matchReason: s.matchReason }));
      currentSearchResultsList = topResults;
      currentSearchActiveIndex = -1;

      if (topResults.length === 0) {
        searchResults.innerHTML = '<div class="search-item" style="color:#94a3b8; justify-content:center;">검색 결과가 없습니다.</div>';
        searchResults.style.display = 'block';
        return;
      }

      function highlightText(text, searchWord) {
        if (!searchWord) return text;
        const reg = new RegExp('(' + searchWord.replace(/[-/\\^$*+?.()|[\]{}]/g, '\\$&') + ')', 'gi');
        return text.replace(reg, '<span class="highlight-match">$1</span>');
      }

      let html = `<div class="search-count-header"><span>검색 결과 (${scored.length}개)</span><span>Enter로 이동</span></div>`;
      html += topResults.map((p, idx) => {
        const cfg = typeConfigs[p.type || 'city'] || typeConfigs.city;
        const displayName = highlightText(p.name, q);
        const reasonHtml = p.matchReason ? `<span style="font-size:11px; margin-left:6px; color:#2563eb; font-weight:normal;">${p.matchReason}</span>` : '';
        return `
          <div class="search-item" id="search_item_${idx}" onmousedown="selectPlace('${p.id}')">
            <div>
              <span style="margin-right:4px">${cfg.icon}</span>
              <strong>${displayName}</strong>
              <span style="font-size:11px; margin-left:6px; color:#6b7280; font-weight:normal;">[${cfg.nameKo}]</span>
              ${reasonHtml}
            </div>
            <span style="font-size:11px; color:#94a3b8;">${p.lat.toFixed(2)}°, ${p.lng.toFixed(2)}°</span>
          </div>
        `;
      }).join('');

      searchResults.innerHTML = html;
      searchResults.style.display = 'block';
    }

    searchInput.addEventListener('input', (e) => executeSearch(e.target.value));

    searchInput.addEventListener('keydown', (e) => {
      if (searchResults.style.display !== 'block' || currentSearchResultsList.length === 0) {
        if (e.key === 'Enter') executeSearch(searchInput.value);
        return;
      }

      if (e.key === 'ArrowDown') {
        e.preventDefault();
        currentSearchActiveIndex = Math.min(currentSearchActiveIndex + 1, currentSearchResultsList.length - 1);
        updateSearchActiveItem();
      } else if (e.key === 'ArrowUp') {
        e.preventDefault();
        currentSearchActiveIndex = Math.max(currentSearchActiveIndex - 1, 0);
        updateSearchActiveItem();
      } else if (e.key === 'Enter') {
        e.preventDefault();
        const pickIdx = currentSearchActiveIndex >= 0 ? currentSearchActiveIndex : 0;
        if (currentSearchResultsList[pickIdx]) {
          selectPlace(currentSearchResultsList[pickIdx].id);
        }
      } else if (e.key === 'Escape') {
        searchResults.style.display = 'none';
      }
    });

    function updateSearchActiveItem() {
      document.querySelectorAll('.search-item').forEach((el, idx) => {
        if (idx === currentSearchActiveIndex) {
          el.classList.add('active');
          el.scrollIntoView({ block: 'nearest' });
        } else {
          el.classList.remove('active');
        }
      });
    }

    window.selectPlace = function(id) {
      const place = placesData.find(p => p.id === id);
      if (place) {
        searchResults.style.display = 'none';
        searchInput.value = place.name;
        showDetail(place);
      }
    };

    window.clearSearch = function() {
      searchInput.value = '';
      executeSearch('');
      searchInput.focus();
    };

    document.addEventListener('click', (e) => {
      if (!e.target.closest('.search-container')) {
        searchResults.style.display = 'none';
      }
    });

    // 8. 족보앱 연동 외부 인터페이스 (API / postMessage)
    window.navigateToPlace = function(nameOrQuery) {
      if (!nameOrQuery) return;
      const target = nameOrQuery.trim();
      const place = placesData.find(p => p.name === target || p.name.includes(target));
      if (place) {
        showDetail(place);
        return true;
      } else {
        searchInput.value = target;
        executeSearch(target);
        return false;
      }
    };

    // iframe postMessage 수신
    window.addEventListener('message', (event) => {
      if (!event.data) return;
      const data = event.data;
      if (data.action === 'showPlace' && data.placeName) {
        window.navigateToPlace(data.placeName);
      } else if (data.action === 'resetView') {
        window.resetMapView();
      }
    });

    function showToast(msg) {
      const t = document.getElementById('toast');
      t.innerText = msg;
      t.style.display = 'block';
      setTimeout(() => { t.style.display = 'none'; }, 2200);
    }

    // 초기 마커 렌더링
    updateMarkers();
  </script>
</body>
</html>

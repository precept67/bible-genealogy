name: "Build Desktop App"

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch: # Allows manual run in GitHub Actions tab

jobs:
  build-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        platform: [macos-latest, windows-latest]

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Rust macOS targets (Intel + Apple Silicon)
        if: matrix.platform == 'macos-latest'
        run: rustup target add x86_64-apple-darwin aarch64-apple-darwin

      - name: Install dependencies
        run: npm install

      - name: Build Web assets into dist
        shell: bash
        run: |
          mkdir -p dist
          cp index.html style_v16_v2.css app_v16_v2.js data_v16_v2.js database.json dist/

      - name: Build Desktop App via Tauri Action
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: "App Release v__VERSION__"
          releaseBody: "Automated draft release containing Windows (.msi) and macOS (.dmg) installers."
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.platform == 'macos-latest' && '--target universal-apple-darwin' || '' }}

name: "Build Desktop App"

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch: # Allows manual run in GitHub Actions tab

jobs:
  build-windows:
    permissions:
      contents: write
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install dependencies
        run: npm install

      - name: Get version from package.json
        id: get_version
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Build Web assets into dist
        shell: bash
        run: |
          mkdir -p dist
          cp index.html style_v16_v2.css app_v16_v2.js data_v16_v2.js database.json app_logo.png dist/

      - name: Disable updater and set nsis target
        shell: bash
        run: |
          node -e "
            const fs = require('fs');
            const path = './src-tauri/tauri.conf.json';
            const data = JSON.parse(fs.readFileSync(path, 'utf8'));
            if (data.tauri && data.tauri.updater) {
              data.tauri.updater.active = false;
            }
            if (data.tauri && data.tauri.bundle) {
              data.tauri.bundle.targets = ['nsis'];
            }
            fs.writeFileSync(path, JSON.stringify(data, null, 2), 'utf8');
            console.log('tauri.conf.json patched: updater disabled, target set to nsis');
          "

      - name: Build Tauri Windows app
        uses: tauri-apps/tauri-action@v0.5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v${{ steps.get_version.outputs.version }}-${{ github.run_number }}
          releaseName: "Bible Genealogy v${{ steps.get_version.outputs.version }} (Build ${{ github.run_number }})"
          releaseBody: "Windows setup installer auto-built from main branch."
          releaseDraft: false
          prerelease: false

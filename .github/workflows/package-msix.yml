name: "Build MSIX Package"

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/package-msix.yml'

jobs:
  build-msix:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Setup Exe & Prepare MSIX Payload
        shell: powershell
        run: |
          Write-Host "Looking for setup.exe..."
          $setupExe = ""
          if (Test-Path "setup.exe") {
              $setupExe = "setup.exe"
          } elseif (Test-Path "releases/_1.1.3_x64-setup.exe") {
              $setupExe = "releases/_1.1.3_x64-setup.exe"
          } else {
              $found = Get-ChildItem -Filter "*.exe" -Recurse | Where-Object { $_.Name -like "*setup*.exe" -or $_.Name -like "*Setup*.exe" } | Select-Object -First 1
              if ($found) { $setupExe = $found.FullName }
          }

          if (-not $setupExe) {
              throw "setup.exe not found in repository!"
          }
          Write-Host "Using installer: $setupExe"

          # Create payload folder
          $payloadDir = "C:\msix_payload"
          New-Item -ItemType Directory -Force -Path $payloadDir | Out-Null

          # Extract with 7-Zip
          Write-Host "Extracting installer using 7-Zip..."
          & "C:\Program Files\7-Zip\7z.exe" x "$setupExe" "-o$payloadDir" -y | Out-Null

          if (Test-Path "$payloadDir\`$PLUGINSDIR") { Remove-Item -Recurse -Force "$payloadDir\`$PLUGINSDIR" }
          if (Test-Path "$payloadDir\Uninstall.exe") { Remove-Item -Force "$payloadDir\Uninstall.exe" }
          if (Test-Path "$payloadDir\uninstall.exe") { Remove-Item -Force "$payloadDir\uninstall.exe" }

          $exes = Get-ChildItem -Path $payloadDir -Filter "*.exe"
          $mainExe = ($exes | Where-Object { $_.Name -notlike "*uninstall*" } | Select-Object -First 1).Name
          Write-Host "Selected Main Executable: $mainExe"

          # Prepare Assets folder
          $assetsDir = Join-Path $payloadDir "Assets"
          New-Item -ItemType Directory -Force -Path $assetsDir | Out-Null

          if (Test-Path "src-tauri\icons") {
              Copy-Item "src-tauri\icons\*" -Destination $assetsDir -Recurse -Force
          }

          if (-not (Test-Path "$assetsDir\StoreLogo.png")) {
              if (Test-Path "$assetsDir\128x128.png") { Copy-Item "$assetsDir\128x128.png" "$assetsDir\StoreLogo.png" }
          }
          if (-not (Test-Path "$assetsDir\Square150x150Logo.png")) {
              if (Test-Path "$assetsDir\128x128.png") { Copy-Item "$assetsDir\128x128.png" "$assetsDir\Square150x150Logo.png" }
          }
          if (-not (Test-Path "$assetsDir\Square44x44Logo.png")) {
              if (Test-Path "$assetsDir\32x32.png") { Copy-Item "$assetsDir\32x32.png" "$assetsDir\Square44x44Logo.png" }
          }

          $manifestContent = @"
<?xml version="1.0" encoding="utf-8"?>
<Package
  xmlns="http://schemas.microsoft.com/appx/manifest/foundation/windows10"
  xmlns:uap="http://schemas.microsoft.com/appx/manifest/uap/windows10"
  xmlns:rescap="http://schemas.microsoft.com/appx/manifest/foundation/windows10/restrictedcapabilities">
  <Identity
    Name="SANGHYUNKIM.OpenBibleGenealogyStory"
    Publisher="CN=8F713185-F19D-4EBC-B893-639B07A18161"
    Version="1.1.3.0"
    ProcessorArchitecture="x64" />
  <Properties>
    <DisplayName>Open Bible Genealogy Story</DisplayName>
    <PublisherDisplayName>SANGHYUN KIM</PublisherDisplayName>
    <Logo>Assets\StoreLogo.png</Logo>
  </Properties>
  <Dependencies>
    <TargetDeviceFamily Name="Windows.Desktop" MinVersion="10.0.17763.0" MaxVersionTested="10.0.22621.0" />
  </Dependencies>
  <Capabilities>
    <rescap:Capability Name="runFullTrust" />
  </Capabilities>
  <Applications>
    <Application Id="App"
      Executable="$mainExe"
      EntryPoint="Windows.FullTrustApplication">
      <uap:VisualElements
        DisplayName="Open Bible Genealogy Story"
        Description="Open Bible Genealogy Story"
        BackgroundColor="transparent"
        Square150x150Logo="Assets\Square150x150Logo.png"
        Square44x44Logo="Assets\Square44x44Logo.png">
      </uap:VisualElements>
    </Application>
  </Applications>
</Package>
"@

          [System.IO.File]::WriteAllText("$payloadDir\AppxManifest.xml", $manifestContent, [System.Text.Encoding]::UTF8)

      - name: Build MSIX with MakeAppx
        shell: powershell
        run: |
          $makeAppx = (Get-ChildItem -Path "C:\Program Files (x86)\Windows Kits\10\bin" -Filter "makeappx.exe" -Recurse | Where-Object { $_.FullName -like "*x64*" } | Select-Object -
